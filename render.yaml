# Render Blueprint for the API. The web app is deployed as a Cloudflare Worker
# (see docs/runbooks/deploy.md). The worker is added here in Sprint 8.
services:
  - type: web
    name: school-mgmt-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: HOST
        value: 0.0.0.0
      # Server-only secrets, set in the Render dashboard (Sprint 2).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Server-only secret, used for photo storage (Sprint 3).
      - key: SUPABASE_SECRET_KEY
        sync: false
