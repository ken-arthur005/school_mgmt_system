# Render Blueprint for the API. The web app is deployed on Cloudflare Pages
# (see docs/runbooks/deploy.md). The worker is added here in Sprint 8.
services:
  - type: web
    name: school-mgmt-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: HOST
        value: 0.0.0.0
