<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5f3" />
    <title>Beverly Hills Academy</title>
    <link rel="icon" type="image/png" href="/brand/crest-64.png" />
    <script>
      // Applies the saved light/dark choice before the first paint, so the screen never flashes.
      // Keep in step with src/lib/theme.ts.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('theme');
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').content = '#0e1118';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
